services:
  nodelink:
    image: performanc/nodelink:latest
    container_name: nodelink-prod
    restart: unless-stopped

    ports:
      - "2333:2333"

    # Security Hardening
    user: "1000:1000"            # Executes process as a safe non-root user
    read_only: true               # Prevents malicious writes to application core binaries
    tmpfs:
      - /tmp                      # Grants explicit, isolated storage access to temp caches
      - /app/.cache:uid=1000,gid=1000 # Allows saving temporary credentials in a read-only environment
      - /app/plugins:uid=1000,gid=1000

    environment:
      - NODELINK_SERVER_PORT=2333
      - NODELINK_SERVER_HOST=0.0.0.0
      - NODE_OPTIONS="--max-old-space-size=450"

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--header=Authorization: youshallnotpass", "http://127.0.0.1:2333/v4/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Log Rotation Configuration (Avoids out-of-disk space errors)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  marmut:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      nodelink:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      LAVALINK_NODE_NAME: Lavalink
      LAVALINK_NODE_URL: nodelink:2333
      LAVALINK_NODE_AUTH: youshallnotpass
      LAVALINK_NODE_IS_SECURE: false
