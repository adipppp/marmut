services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS
      API_TOKEN: ${YT_CIPHER_API_TOKEN}
    expose:
      - "8001"
    networks:
      - marmut-network

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    user: "0:0"
    depends_on:
      yt-cipher:
        condition: service_started
    environment:
      _JAVA_OPTIONS: >-
        -Xms512m -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      YT_CIPHER_API_TOKEN: ${YT_CIPHER_API_TOKEN}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
    expose:
      - "2333"
    networks:
      - marmut-network

  marmut:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      LAVALINK_NODE_NAME: Docker Lavalink
      LAVALINK_NODE_URL: lavalink:2333
      LAVALINK_NODE_IS_SECURE: "false"
    networks:
      - marmut-network

networks:
  marmut-network:
    driver: bridge
